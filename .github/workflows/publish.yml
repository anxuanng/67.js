name: Publish 67js

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json]

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@12.1.0
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run prepare:release
      - run: npm run smoke:package
      - run: npm run smoke:mcp-package -- --protocol-only
      - name: Publish a new version through OIDC
        run: npm run publish:ci

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create the tag and release page if they are missing
        run: node scripts/release-publish-notes.mjs
        env:
          GH_TOKEN: ${{ github.token }}
